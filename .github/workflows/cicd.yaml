name: NexusMarket CI/CD
on:
  push:
    branches: ["main", "develop", "master"]
  pull_request:
    branches: ["main", "develop", "master"]

jobs:
  # --- Stage 1: Run Tests ---
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nexus_market
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Test Order Service
        run: cd services/order-service && npm install && NODE_ENV=test npm test
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Test Payment Service
        run: cd services/payment-service && npm install && NODE_ENV=test npm test

      - name: Test Notification Service
        run: cd services/notification-service && npm install && NODE_ENV=test npm test
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Test Auth Service
        env:
          POSTGRES_HOST: localhost
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          cd services/auth-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py test

      - name: Test Catalog Service
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          cd services/catalog-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py test

  # --- Stage 2: SonarQube Code Quality ---
  sonarqube:
    name: SonarQube Code Quality
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Generate Coverage - Order Service
        run: |
          cd services/order-service
          npm install
          NODE_ENV=test npm test -- --coverage --coverageReporters=lcov 2>/dev/null || true
        env:
          REDIS_URL: redis://localhost:6379/0
        continue-on-error: true

      - name: Generate Coverage - Payment Service
        run: |
          cd services/payment-service
          npm install
          NODE_ENV=test npm test -- --coverage --coverageReporters=lcov 2>/dev/null || true
        continue-on-error: true

      - name: Generate Coverage - Notification Service
        run: |
          cd services/notification-service
          npm install
          NODE_ENV=test npm test -- --coverage --coverageReporters=lcov 2>/dev/null || true
        env:
          REDIS_URL: redis://localhost:6379/0
        continue-on-error: true

      - name: Generate Coverage - Auth Service
        run: |
          cd services/auth-service
          pip install -r requirements.txt coverage
          coverage run manage.py test
          coverage xml -o coverage.xml
        env:
          POSTGRES_HOST: localhost
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        continue-on-error: true

      - name: Generate Coverage - Catalog Service
        run: |
          cd services/catalog-service
          pip install -r requirements.txt coverage
          coverage run manage.py test
          coverage xml -o coverage.xml
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # --- Stage 3: Snyk Security Scan (SAST + SCA + IaC) ---
  snyk-sast:
    name: Snyk Security Scan
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk SAST - Scan Source Code
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: false

      - name: Snyk SCA - Order Service
        run: cd services/order-service && npm install && snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk SCA - Payment Service
        run: cd services/payment-service && npm install && snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk SCA - Notification Service
        run: cd services/notification-service && npm install && snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk SCA - Frontend
        run: cd services/frontend && npm install && snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk SCA - Auth Service
        run: |
          cd services/auth-service
          pip install -r requirements.txt
          snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk SCA - Catalog Service
        run: |
          cd services/catalog-service
          pip install -r requirements.txt
          snyk test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

      - name: Snyk IaC - Kubernetes Manifests
        run: snyk iac test K8s/ --severity-threshold=medium
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  # --- Stage 4: Build and Push Docker Images to ECR ---
  build-and-push:
    name: Build and Push Docker Images
    needs: [test, sonarqube, snyk-sast]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check AWS Identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Prefix and Tag
        run: |
          echo "ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build & Push Auth Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/auth-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/auth-service:latest \
                       ./services/auth-service
          docker push $ECR_REGISTRY/nexusmarket/auth-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/auth-service:latest

      - name: Build & Push Catalog Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/catalog-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/catalog-service:latest \
                       ./services/catalog-service
          docker push $ECR_REGISTRY/nexusmarket/catalog-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/catalog-service:latest

      - name: Build & Push Order Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/order-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/order-service:latest \
                       ./services/order-service
          docker push $ECR_REGISTRY/nexusmarket/order-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/order-service:latest

      - name: Build & Push Payment Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/payment-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/payment-service:latest \
                       ./services/payment-service
          docker push $ECR_REGISTRY/nexusmarket/payment-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/payment-service:latest

      - name: Build & Push Notification Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/notification-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/notification-service:latest \
                       ./services/notification-service
          docker push $ECR_REGISTRY/nexusmarket/notification-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/notification-service:latest

      - name: Build & Push Frontend
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/frontend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/frontend:latest \
                       ./services/frontend
          docker push $ECR_REGISTRY/nexusmarket/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/frontend:latest

      - name: All Images Pushed Successfully
        run: echo "✅ All services built and pushed to ECR!"

  # --- Stage 5: Deploy to EKS ---
  deploy:
    name: Deploy to EKS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name YOUR_EKS_CLUSTER_NAME \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy - Update Image Tags
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${{ github.sha }}"

          kubectl set image deployment/auth-service auth-service=$ECR_REGISTRY/nexusmarket/auth-service:$IMAGE_TAG
          kubectl set image deployment/catalog-service catalog-service=$ECR_REGISTRY/nexusmarket/catalog-service:$IMAGE_TAG
          kubectl set image deployment/order-service order-service=$ECR_REGISTRY/nexusmarket/order-service:$IMAGE_TAG
          kubectl set image deployment/payment-service payment-service=$ECR_REGISTRY/nexusmarket/payment-service:$IMAGE_TAG
          kubectl set image deployment/notification-service notification-service=$ECR_REGISTRY/nexusmarket/notification-service:$IMAGE_TAG
          kubectl set image deployment/frontend frontend=$ECR_REGISTRY/nexusmarket/frontend:$IMAGE_TAG

      - name: Wait for Rollouts to Complete
        run: |
          kubectl rollout status deployment/auth-service --timeout=120s
          kubectl rollout status deployment/catalog-service --timeout=120s
          kubectl rollout status deployment/order-service --timeout=120s
          kubectl rollout status deployment/payment-service --timeout=120s
          kubectl rollout status deployment/notification-service --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Deployment Successful
        run: echo "✅ All services deployed to EKS!"