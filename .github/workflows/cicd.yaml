name: NexusMarket CI
on:
  push: 
    branches: ["main","develop","master"]
  pull_request:
    branches: ["main","develop","master"]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nexus_market
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Test Order Service
        run: cd services/order-service && npm install && NODE_ENV=test npm test
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Test Payment Service
        run: cd services/payment-service && npm install && NODE_ENV=test npm test

      - name: Test Notification Service
        run: cd services/notification-service && npm install && NODE_ENV=test npm test
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Test Auth Service
        env:
          POSTGRES_HOST: localhost
        run: |
          cd services/auth-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py test

      - name: Test Catalog Service
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd services/catalog-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2

    
      - name: Build Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: false
          tags: nexusmarket/auth-service:latest

      - name: Build catalog Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalog-service
          file: ./services/catalog-service/Dockerfile
          push: false
          tags: nexusmarket/catalog-service:latest

      - name: Build notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          file: ./services/notification-service/Dockerfile
          push: false
          tags: nexusmarket/notification-service:latest

      - name: Build order Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          file: ./services/order-service/Dockerfile
          push: false
          tags: nexusmarket/order-service:latest  
      
      - name: Build payment Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment-service
          file: ./services/payment-service/Dockerfile
          push: false
          tags: nexusmarket/payment-service:latest
        
      - name: Build frontend Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: false
          tags: nexusmarket/frontend:latest
      
      - name: All services built successfully
        run: echo " All services built successfully!"