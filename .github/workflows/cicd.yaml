name: NexusMarket CI
on:
  push: 
    branches: ["main","develop","master"]
  pull_request:
    branches: ["main","develop","master"]

jobs:
  # ============================================================
  # JOB 1: Run all unit tests
  # ============================================================
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nexus_market
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Test Order Service
        run: cd services/order-service && npm install && NODE_ENV=test npm test
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Test Payment Service
        run: cd services/payment-service && npm install && NODE_ENV=test npm test

      - name: Test Notification Service
        run: cd services/notification-service && npm install && NODE_ENV=test npm test
        env:
          REDIS_URL: redis://localhost:6379/0

      - name: Test Auth Service
        env:
          POSTGRES_HOST: localhost
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          cd services/auth-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py test

      - name: Test Catalog Service
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        run: |
          cd services/catalog-service
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py test

  # ============================================================
  # JOB 2: SonarQube — Code Quality Analysis
  #
  # What is SonarQube?
  # ------------------
  # SonarQube is a code quality tool. After your tests run,
  # it scans all your source code and checks for:
  #   - Bugs (code that might crash)
  #   - Code Smells (messy or hard-to-maintain code)
  #   - Security Hotspots (places where hackers could attack)
  #   - Duplicated code
  #   - Test coverage (how much of your code is tested)
  #
  # It then gives your project a "Quality Gate" — PASS or FAIL.
  # If it fails, the pipeline stops and Docker images are NOT built.
  # This ensures only clean, secure code reaches production.
  #
  # Setup required (one time):
  #   1. Go to https://sonarcloud.io  (free for open-source projects)
  #   2. Sign in with your GitHub account
  #   3. Create an Organization and import your repository
  #   4. Copy your SONAR_TOKEN from Project Settings > Security
  #   5. Add it to GitHub: Settings > Secrets > SONAR_TOKEN
  # ============================================================
  sonarqube:
    name: SonarQube Code Quality
    needs: test          # Only runs AFTER all tests pass
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        # fetch-depth: 0 means get the FULL git history.
        # SonarQube needs this to calculate things like
        # "new code since last version" and blame information.
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js (for JS/TS coverage reports)
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Setup Python (for Python coverage reports)
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # --- Generate test coverage for Node.js services ---
      # Coverage = which lines of code were executed during tests.
      # SonarQube reads these reports and shows you exactly
      # which functions/lines have NO test coverage.
      - name: Generate Coverage - Order Service
        run: |
          cd services/order-service
          npm install
          NODE_ENV=test npm test -- --coverage --coverageReporters=lcov 2>/dev/null || true
        env:
          REDIS_URL: redis://localhost:6379/0
        continue-on-error: true  # Don't fail if coverage fails

      - name: Generate Coverage - Payment Service
        run: |
          cd services/payment-service
          npm install
          NODE_ENV=test npm test -- --coverage --coverageReporters=lcov 2>/dev/null || true
        continue-on-error: true

      - name: Generate Coverage - Notification Service
        run: |
          cd services/notification-service
          npm install
          NODE_ENV=test npm test -- --coverage --coverageReporters=lcov 2>/dev/null || true
        env:
          REDIS_URL: redis://localhost:6379/0
        continue-on-error: true

      # --- Generate test coverage for Django services ---
      - name: Generate Coverage - Auth Service
        run: |
          cd services/auth-service
          pip install -r requirements.txt coverage
          coverage run manage.py test
          coverage xml -o coverage.xml
        env:
          POSTGRES_HOST: localhost
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        continue-on-error: true
        services:
          # Note: inherited from job-level but we re-declare for clarity
          {}

      - name: Generate Coverage - Catalog Service
        run: |
          cd services/catalog-service
          pip install -r requirements.txt coverage
          coverage run manage.py test
          coverage xml -o coverage.xml
        env:
          POSTGRES_HOST: localhost
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key-not-for-production
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          DEBUG: "True"
          ALLOWED_HOSTS: "localhost,127.0.0.1"
        continue-on-error: true

      # --- The main SonarQube scan step ---
      # This action sends your code + coverage reports to SonarCloud.
      # SonarCloud analyzes everything and returns PASS or FAIL.
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          # SONAR_TOKEN: Your secret token from sonarcloud.io
          # Add this in: GitHub repo > Settings > Secrets > Actions
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ============================================================
  # JOB 3: Build Docker images and push to Amazon ECR
  # Only runs if BOTH tests AND SonarQube Quality Gate PASS
  # ============================================================
  build-and-push:
    name: Build and Push Docker Images
    needs: [test, sonarqube]   # <-- Now waits for SonarQube too!
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image prefix
        run: |
          echo "ECR_REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_ENV

      - name: Build & Push Auth Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/auth-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/auth-service:latest \
                       ./services/auth-service
          docker push $ECR_REGISTRY/nexusmarket/auth-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/auth-service:latest

      - name: Build & Push Catalog Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/catalog-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/catalog-service:latest \
                       ./services/catalog-service
          docker push $ECR_REGISTRY/nexusmarket/catalog-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/catalog-service:latest
      
      - name: Build & Push Order Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/order-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/order-service:latest \
                       ./services/order-service
          docker push $ECR_REGISTRY/nexusmarket/order-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/order-service:latest   
      
      - name: Build & Push Payment Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/payment-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/payment-service:latest \
                       ./services/payment-service
          docker push $ECR_REGISTRY/nexusmarket/payment-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/payment-service:latest  
      
      - name: Build & Push Notification Service
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/notification-service:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/notification-service:latest \
                       ./services/notification-service
          docker push $ECR_REGISTRY/nexusmarket/notification-service:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/notification-service:latest
      
      - name: Build & Push Frontend
        run: |
          docker build -t $ECR_REGISTRY/nexusmarket/frontend:$IMAGE_TAG \
                       -t $ECR_REGISTRY/nexusmarket/frontend:latest \
                       ./services/frontend
          docker push $ECR_REGISTRY/nexusmarket/frontend:$IMAGE_TAG
          docker push $ECR_REGISTRY/nexusmarket/frontend:latest

      - name: All images pushed successfully
        run: echo "✅ All services built and pushed to ECR!"

  # ============================================================
  # JOB 4: Deploy to EKS
  # ============================================================
  deploy:
    name: Deploy to EKS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.30.0'

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name YOUR_EKS_CLUSTER_NAME \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy - Update image tags
        run: |
          ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
          IMAGE_TAG="${{ github.sha }}"

          echo "Updating deployments with image tag: $IMAGE_TAG"

          kubectl set image deployment/auth-service auth-service=$ECR_REGISTRY/nexusmarket/auth-service:$IMAGE_TAG --record
          kubectl set image deployment/catalog-service catalog-service=$ECR_REGISTRY/nexusmarket/catalog-service:$IMAGE_TAG --record
          kubectl set image deployment/order-service order-service=$ECR_REGISTRY/nexusmarket/order-service:$IMAGE_TAG --record
          kubectl set image deployment/payment-service payment-service=$ECR_REGISTRY/nexusmarket/payment-service:$IMAGE_TAG --record
          kubectl set image deployment/notification-service notification-service=$ECR_REGISTRY/nexusmarket/notification-service:$IMAGE_TAG --record
          kubectl set image deployment/frontend frontend=$ECR_REGISTRY/nexusmarket/frontend:$IMAGE_TAG --record

      - name: Wait for rollouts to complete
        run: |
          kubectl rollout status deployment/auth-service --timeout=120s
          kubectl rollout status deployment/catalog-service --timeout=120s
          kubectl rollout status deployment/order-service --timeout=120s
          kubectl rollout status deployment/payment-service --timeout=120s
          kubectl rollout status deployment/notification-service --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s

      - name: Deployment successful
        run: echo "✅ All services successfully deployed to EKS!"