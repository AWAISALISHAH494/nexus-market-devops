name: NexusMarket CI
on:
  push: 
    branches: ["main","develop","master"]
  pull_request:
    branches: ["main","develop","master"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      
      - name: setup docker buildx
        uses: docker/setup-buildx-action@v2

    
      - name: Build Auth Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/auth-service
          file: ./services/auth-service/Dockerfile
          push: false
          tags: nexusmarket/auth-service:latest

      - name: Build catalog Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/catalog-service
          file: ./services/catalog-service/Dockerfile
          push: false
          tags: nexusmarket/catalog-service:latest

      - name: Build notification Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/notification-service
          file: ./services/notification-service/Dockerfile
          push: false
          tags: nexusmarket/notification-service:latest

      - name: Build order Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          file: ./services/order-service/Dockerfile
          push: false
          tags: nexusmarket/order-service:latest  
      
      - name: Build payment Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/payment-service
          file: ./services/payment-service/Dockerfile
          push: false
          tags: nexusmarket/payment-service:latest
        
      - name: Build frontend Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          file: ./services/frontend/Dockerfile
          push: false
          tags: nexusmarket/frontend:latest
      
      - name: All services built successfully
        run: echo "✅ All services built successfully!"