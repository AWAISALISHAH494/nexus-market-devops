apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      # Pod-level: run all containers as non-root by default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: payment-service
          image: 045555583673.dkr.ecr.us-east-1.amazonaws.com/nexusmarket/payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          env:
            - name: PORT
              value: "8006"
            - name: DATABASE_URL
              value: "postgres://postgres:password@postgres-nexus:5432/nexus_market"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
          # Container-level security hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          # Resource limits (CPU & Memory)
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          # Liveness probe
          livenessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 20
            periodSeconds: 15
            failureThreshold: 3
          # Readiness probe
          readinessProbe:
            httpGet:
              path: /health
              port: 8006
            initialDelaySeconds: 10
            periodSeconds: 10