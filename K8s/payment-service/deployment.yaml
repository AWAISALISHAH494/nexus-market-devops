apiVersion: apps/v1
kind: Deployment

metadata:
  name: payment-service
  labels:
    app: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: payment-service
          image: 045555583673.dkr.ecr.us-east-1.amazonaws.com/nexusmarket/payment-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8006
          env:
            - name: PORT
              value: "8006"
            - name: DATABASE_URL
              value: "postgres://postgres:password@postgres-nexus:5432/nexus_market"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"