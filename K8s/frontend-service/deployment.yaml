apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-service
  labels:
    app: frontend-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      # Pod-level: run all containers as non-root by default
      securityContext:
        runAsNonRoot: true
        runAsUser: 101    # nginx official image uses uid 101
        runAsGroup: 101
        fsGroup: 101

      containers:
        - name: frontend-service
          image: 045555583673.dkr.ecr.us-east-1.amazonaws.com/nexusmarket/frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          # Container-level security hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx needs /tmp and /var/cache write access
            runAsNonRoot: true
            runAsUser: 101
            capabilities:
              drop:
                - ALL
          # Resource limits (CPU & Memory)
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          # Liveness probe
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          # Readiness probe
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10