apiVersion: apps/v1
kind: Deployment

metadata:
  name: catalog-service
  labels:
    app: catalog-service

spec:
  replicas: 3
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      # Pod-level: run all containers as non-root by default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      containers:
        - name: catalog-service
          image: 045555583673.dkr.ecr.us-east-1.amazonaws.com/nexusmarket/catalog-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_DB
              value: "nexus_market"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_HOST
              value: "postgres-nexus"
            - name: POSTGRES_PORT
              value: "5432"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"
            - name: DJANGO_SECRET_KEY
              value: "k8s-local-dev-secret-key-replace-in-production"
            - name: JWT_SECRET
              value: "nexus-jwt-secret-key-replace-in-production"
            - name: DEBUG
              value: "True"
            - name: ALLOWED_HOSTS
              value: "localhost,127.0.0.1,catalog-service"
          # Container-level security hardening
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Django needs write access for tmp/sessions
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          # Resource limits (CPU & Memory)
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          # Liveness probe
          livenessProbe:
            httpGet:
              path: /api/products/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 3
          # Readiness probe
          readinessProbe:
            httpGet:
              path: /api/products/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10