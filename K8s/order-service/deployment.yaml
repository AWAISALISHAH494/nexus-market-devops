apiVersion: apps/v1
kind: Deployment 

metadata:
  name: order-service
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: order-service
          image: 045555583673.dkr.ecr.us-east-1.amazonaws.com/nexusmarket/order-service:6cb25eaa449c9dd01a4c09efd9179dc79a66b1fa
          ports:
            - containerPort: 8005
          env:
            - name: DATABASE_URL
              value: "postgres://postgres:password@postgres-nexus:5432/nexus_market"
            - name: REDIS_URL
              value: "redis://redis-service:6379/0"